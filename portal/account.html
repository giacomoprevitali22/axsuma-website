<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account – Axsuma Portal</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{--teal:#00594a;--teal-light:#007a66;--dark:#2a2f36;--dark-soft:#4a5568;--mid:#718096;--off-white:#f7f8f9;--white:#ffffff;--border:#e2e8f0;--red:#dc2626;--font:'DM Sans',sans-serif;--font-heading:'Inter',sans-serif}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font);background:var(--off-white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
    .auth-card{background:var(--white);border:1px solid var(--border);border-radius:12px;max-width:420px;width:100%;padding:2.5rem;box-shadow:0 4px 20px rgba(0,0,0,.04)}
    .auth-logo{display:block;margin:0 auto 1.8rem;height:36px}
    .auth-title{font-family:var(--font-heading);font-size:1.3rem;font-weight:600;color:var(--dark);text-align:center;margin-bottom:.4rem}
    .auth-sub{font-size:.85rem;color:var(--mid);text-align:center;margin-bottom:2rem}
    .field{margin-bottom:1.2rem}
    .field label{display:block;font-size:.78rem;font-weight:500;color:var(--dark);margin-bottom:.4rem;letter-spacing:.3px}
    .field input{width:100%;padding:.65rem .8rem;font-family:var(--font);font-size:.88rem;border:1px solid var(--border);border-radius:6px;transition:border-color .2s}
    .field input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px rgba(0,89,74,.08)}
    .btn-login{width:100%;padding:.75rem;background:var(--teal);color:#fff;font-family:var(--font);font-size:.9rem;font-weight:600;border:none;border-radius:6px;cursor:pointer;transition:background .2s;letter-spacing:.3px}
    .btn-login:hover{background:var(--teal-light)}
    .btn-login:disabled{opacity:.6;cursor:not-allowed}
    .error-msg{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.15);color:var(--red);font-size:.82rem;padding:.6rem .8rem;border-radius:6px;margin-bottom:1.2rem;display:none}
    .error-msg.show{display:block}
    .auth-footer{text-align:center;margin-top:1.5rem;font-size:.82rem;color:var(--mid)}
    .auth-footer a{color:var(--teal);text-decoration:none;font-weight:500}
    .auth-footer a:hover{text-decoration:underline}
    .back-link{display:block;text-align:center;margin-top:1.5rem;font-size:.78rem;color:var(--mid)}
    .back-link a{color:var(--mid);text-decoration:none}
    .back-link a:hover{color:var(--teal)}
  </style>
</head>
<body>

<div class="auth-card">
  <img src="../axsuma-brand.svg" alt="Axsuma" class="auth-logo">
  <h1 class="auth-title">My Account</h1>
  <p class="auth-sub" id="who">Change your password</p>

  <div id="errorMsg" class="error-msg"></div>
  <div id="okMsg" class="error-msg" style="background:#ecfdf5;border-color:#a7f3d0;color:#065f46"></div>

  <form id="pwForm" onsubmit="return changePw(event)">
    <div class="field">
      <label for="cur">Current Password</label>
      <input type="password" id="cur" required autocomplete="current-password">
    </div>
    <div class="field">
      <label for="np">New Password</label>
      <input type="password" id="np" required minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters">
    </div>
    <div class="field">
      <label for="np2">Confirm New Password</label>
      <input type="password" id="np2" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="btn-login" id="btnPw"><i class="fas fa-key" style="margin-right:.4rem"></i> Update Password</button>
  </form>
</div>

<div class="back-link"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to the portal</a></div>

<script>
fetch('/api/auth/me').then(function(r){return r.ok?r.json():null}).then(function(u){if(u)document.getElementById('who').textContent=u.name+' \u00b7 '+u.email;}).catch(function(){});
async function changePw(e){
  e.preventDefault();
  var er=document.getElementById('errorMsg'), ok=document.getElementById('okMsg');
  er.classList.remove('show'); ok.classList.remove('show');
  if(document.getElementById('np').value!==document.getElementById('np2').value){er.textContent='New passwords do not match.';er.classList.add('show');return false;}
  var res=await fetch('/api/auth/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:document.getElementById('cur').value,newPassword:document.getElementById('np').value})});
  var d=await res.json().catch(function(){return {}});
  if(!res.ok){er.textContent=d.error||'Update failed.';er.classList.add('show');return false;}
  document.getElementById('pwForm').reset(); ok.textContent='Password updated.'; ok.classList.add('show'); return false;
}
</script>
</body>
</html>
